[project]
name = "quantum"
version = "0.1.0"
description = "A small quantum circuit simulator built with NumPy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
quantum = "quantum.main:main"
